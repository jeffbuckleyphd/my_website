      <line x1="660" y1="95" x2="740" y2="95" class="connector-line"></line>

      <rect x="320" y="20" width="360" height="130" rx="28" ry="28" class="top-box"></rect>
      <text x="500" y="73" text-anchor="middle" class="top-box-text">Technology and</text>
      <text x="500" y="118" text-anchor="middle" class="top-box-text">Engineering Education</text>

      <rect x="35" y="95" width="230" height="110" rx="24" ry="24" class="side-box dashed"></rect>

      <circle cx="330" cy="455" r="240" class="circle spatial circle-main" data-key="spatial"></circle>

      <text x="250" y="390" text-anchor="middle" class="circle-label">Spatial Ability</text>

  </div>
  
  <div class="info-panel">
    <h3 id="info-title">Select an area</h3>
    <p id="info-text" class="text-muted">Click any circle or intersection on the diagram to explore related research themes.</p>
    
    <div class="info-section">
      <h4>Current focus</h4>
      <ul id="info-focus">
        <li>Current themes will appear here</li>
      </ul>
    </div>

    <div class="info-section">
      <h4>PhD supervision</h4>
      <p id="info-supervision">Supervision note will appear here.</p>
    </div>

    <p><a id="info-link" href="#" class="btn-link">View related publications</a></p>
    <button type="button" class="btn-reset" onclick="resetDiagram()">Reset Diagram</button>
  </div>
</div>

<style>
  .research-wrap { display: grid; grid-template-columns: minmax(500px, 2fr) 1fr; gap: 2rem; align-items: start; margin-top: 1.5rem; }
  .diagram-panel { width: 100%; }
  .venn-svg { width: 100%; height: auto; }
  
  .outer-box, .top-box, .side-box, .connector-line, .circle { stroke: #212529; stroke-width: 5; }
  .outer-box, .top-box, .side-box { fill: #f8f9fa; }
  .dashed { stroke-dasharray: 12 8; }
  .connector-line { fill: none; }
  .top-box-text { font-size: 1.1rem; font-weight: 700; fill: #212529;}
  .side-box-text { font-size: 0.95rem; font-weight: 700; fill: #212529;}
  .circle-label { font-size: 1.1rem; font-weight: 700; pointer-events: none; fill: #212529; }
  
  .circle { fill-opacity: 0.5; cursor: pointer; transition: opacity 0.3s ease; }
  .spatial { fill: #aee3e7; }
  .cj { fill: #cfe3cf; }
  .meta { fill: #e9ecef; }
  
  .overlap { fill: transparent; stroke: #212529; stroke-width: 0; cursor: pointer; transition: all 0.2s ease; }
  .overlap:hover { fill: rgba(33, 37, 41, 0.15); stroke-width: 3; }
  .overlap.active-shape { fill: rgba(33, 37, 41, 0.25) !important; stroke-width: 4; opacity: 1 !important; }

  .dimmed { opacity: 0.15; }
  .active-shape { opacity: 1 !important; stroke-width: 7; }

  .info-panel { border: 1px solid #dee2e6; border-radius: 0.375rem; padding: 1.5rem; background: #ffffff; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); position: sticky; top: 2rem; }
  .info-panel h3 { margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid #e9ecef; padding-bottom: 0.5rem; margin-bottom: 1rem; }
  .info-section { margin-top: 1.25rem; }
  .info-section h4 { margin-bottom: 0.5rem; font-size: 1.1rem; color: #495057; }
  #info-text { margin-bottom: 1.5rem; line-height: 1.6; }
  #info-focus { padding-left: 1.25rem; margin-bottom: 1.5rem; line-height: 1.5; }
  
  .btn-reset { margin-top: 1rem; padding: 0.375rem 0.75rem; border: 1px solid #ced4da; border-radius: 0.25rem; background: #f8f9fa; color: #212529; font-weight: 500; cursor: pointer; transition: all 0.15s ease-in-out; width: 100%; }
  .btn-reset:hover { background: #e2e6ea; border-color: #dae0e5; }
  .btn-link { font-weight: 500; text-decoration: none; color: #0d6efd; }
  .btn-link:hover { text-decoration: underline; color: #0a58ca; }
  .text-muted { color: #6c757d; }

  @media (max-width: 900px) {
    .research-wrap { grid-template-columns: 1fr; }
    .info-panel { position: static; }
  }
</style>

<script>
  const content = {
    spatial: {
      title: "Spatial Ability",
      text: "This strand focuses on spatial ability as a factor in learning, development, and performance, especially in technology and engineering education.",
      focus: ["Spatial ability in technology and engineering education", "Development and intervention research", "Conceptual framing of spatial constructs"],
      supervision: "I am open to supervising PhD work related to spatial ability, learning, and education.",
      link: "/publications-spatial.html"
    },
    cj: {
      title: "Comparative Judgement",
      text: "This strand focuses on comparative judgement, open-ended assessment, and decision-making in educational contexts.",
      focus: ["Adaptive comparative judgement", "Assessment theory and method", "Decision-making in complex evaluation"],
      supervision: "I am open to supervising PhD work related to comparative judgement, assessment, and educational decision-making.",
      link: "/publications-cj.html"
    },
    meta: {
      title: "Meta-research",
      text: "This strand focuses on research credibility, verification, replication, transparency, and the quality of evidence in educational research.",
      focus: ["Research credibility and transparency", "Verification and replication studies", "Meta-scientific review and critique"],
      supervision: "I am open to supervising PhD work related to research quality, credibility, and meta-research.",
      link: "/publications-meta.html"
    },
    spatial_cj: {
      title: "Spatial × Comparative Judgement",
      text: "This overlap reflects my interest in how complex competencies and performances are recognised, interpreted, and judged in authentic educational settings.",
      focus: ["Assessment of complex performance", "Construct representation in judgement-based formats", "Links between cognition and evaluative judgement"],
      supervision: "I am open to supervising doctoral work that connects cognition, performance, and assessment.",
      link: "/publications-spatial-cj.html"
    },
    spatial_meta: {
      title: "Spatial Ability × Meta-research",
      text: "This overlap reflects work on how evidence about spatial ability is synthesised, evaluated, and strengthened through conceptual and methodological scrutiny.",
      focus: ["Evidence synthesis", "Methodological quality in spatial research", "Conceptual clarity and review work"],
      supervision: "I am open to supervising doctoral work that combines substantive spatial research with methodological reflection or evidence synthesis.",
      link: "/publications-spatial-meta.html"
    },
    cj_meta: {
      title: "Comparative Judgement × Meta-research",
      text: "This overlap reflects my interest in the credibility, validation, and methodological scrutiny of judgement-based assessment systems.",
      focus: ["Validation of assessment systems", "Trustworthiness of judgement-based evidence", "Methodological development in assessment research"],
      supervision: "I am open to supervising doctoral work on validity, evidence quality, and methodological development in assessment research.",
      link: "/publications-cj-meta.html"
    },
    all: {
      title: "Integrated Programme",
      text: "At the centre of these strands is a broader interest in how learning is understood, how educational quality is judged, and how trustworthy knowledge is produced.",
      focus: ["Learning, judgement, and evidence quality", "Human-centred educational evaluation", "The relationship between substantive and methodological scholarship"],
      supervision: "Prospective PhD candidates whose interests bridge these areas are especially encouraged to explore this part of my current work.",
      link: "/publications-current-work.html"
    }
  };

  const clickableShapes = () => Array.from(document.querySelectorAll(".circle-main, .overlap"));

  function updatePanel(key) {
    document.getElementById("info-title").textContent = content[key].title;
    
    const infoText = document.getElementById("info-text");
    infoText.textContent = content[key].text;
    infoText.classList.remove("text-muted"); 

    document.getElementById("info-supervision").textContent = content[key].supervision;
    document.getElementById("info-link").href = content[key].link;
    
    const focusList = document.getElementById("info-focus");
    focusList.innerHTML = "";
    content[key].focus.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      focusList.appendChild(li);
    });
  }

  function activateShape(key) {
    clickableShapes().forEach(shape => {
      shape.classList.add("dimmed");
      shape.classList.remove("active-shape");
    });
    
    const selected = document.querySelector('[data-key="' + key + '"]');
    if (selected) {
      selected.classList.remove("dimmed");
      selected.classList.add("active-shape");
    }
    updatePanel(key);
  }

  function resetDiagram() {
    clickableShapes().forEach(shape => {
      shape.classList.remove("dimmed");
      shape.classList.remove("active-shape");
    });
    
    document.getElementById("info-title").textContent = "Select an area";
    
    const infoText = document.getElementById("info-text");
    infoText.textContent = "Click any circle or intersection on the diagram to explore related research themes.";
    infoText.classList.add("text-muted");

    document.getElementById("info-supervision").textContent = "Supervision note will appear here.";
    document.getElementById("info-link").href = "#";
    document.getElementById("info-focus").innerHTML = "<li>Current themes will appear here</li>";
  }

  document.addEventListener("DOMContentLoaded", function () {
    clickableShapes().forEach(shape => {
      shape.addEventListener("click", function () {
        activateShape(this.dataset.key);
      });
    });
  });
</script>
